name: New Evo alerts

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode"
        type: boolean
        default: false
      test_url:
        description: "Test URL"
        type: string
        default: ""

permissions:
  contents: write          # needed to save posted.json back to the repo

concurrency:
  group: evo-alerts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PING_ROLE_ID: ${{ secrets.PING_ROLE_ID }}
          TEST_MODE: ${{ inputs.test && '1' || '' }}
          TEST_URL: ${{ inputs.test_url }}
          # Real runs keep re-checking the site for up to 15 minutes, since new
          # content only appears at release time. Test runs check once.
          POLL_MINUTES: ${{ !inputs.test && '15' || '' }}

      - name: Save posted list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json || true
          git diff --staged --quiet || (git commit -m "Update posted evolutions" && git pull --rebase && git push)
